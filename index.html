<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat CLI</title>
    <style>
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        max-width: 600px;
        padding: 20px;
        border: 1px solid #30363d;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #58a6ff;
      }
      code {
        background: #161b22;
        padding: 2px 6px;
        border-radius: 4px;
        color: #79c0ff;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #238636;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Gemini-Chat-CLI 🤖</h1>
      <p>A cross-platform Node.js terminal client for Google Gemini.</p>
      <img
        src="https://raw.githubusercontent.com/Kaveesha125/Gemini-Chat-CLI/main/demo.webp"
        alt="App Demo"
        style="max-width: 100%; border-radius: 5px; margin: 10px 0"
      />
      <p>To install, open your terminal and run:</p>
      <p>
        <code
          >git clone https://github.com/Kaveesha125/Gemini-Chat-CLI.git</code
        >
      </p>
      <a href="https://github.com/Kaveesha125/Gemini-Chat-CLI" class="btn"
        >View on GitHub</a
      >
    </div>
  </body>
</html>
